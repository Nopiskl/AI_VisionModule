# camera-mpp-service current default profile.
# This file is the machine-readable owner of defaults. A selected default is
# still only a Candidate capability until it has V851S board evidence.

ipc.socket_path=/run/v851s-camera/mpp.sock
ipc.backend_lock_path=/run/v851s-camera/backend.lock
storage.root=/mnt/extsd/v851s-camera
playback.media_root=/mnt/extsd
# Do not write recordings into an empty mount point on the root filesystem.
storage.require_media_root_mount=1

mpp.align_width=32

# Current V853 physical LCD/VO canvas, matching sample_virvi2vo.conf.
# Qt has a separate 800x480 logical canvas with linuxfb rotation=90.
# Never pass the rotated Qt screen dimensions directly to VO.
# HLAY(channel, layer)=channel*4+layer. MPP owns handle 0. Handle 4 belongs to
# Qt/linuxfb while Camera/Playback is active and is only registered as an
# outside layer; the service never opens, closes, enables, disables or
# reconfigures it. camera-gui queries the real framebuffer handle and refuses
# to start MPP unless it is 4 and differs from the video handle. In YOLO mode
# both Qt and MPP are stopped before the worker takes over the framebuffer.
display.vo_device=0
display.video_layer=0
display.video_channel=0
display.ui_outside_layer=4
display.interface=lcd
display.sync=ntsc
display.x=0
display.y=0
display.width=480
display.height=800
# User-selected sample_virvi2vo profile: use the complete physical window.
# contain remains available if borders are preferred.
# This scales the VO output only; it does not rotate captured/encoded pixels.
display.scale_mode=stretch

camera.isp_device=0
camera.vipp_device=0
camera.preview_channel=0
camera.record_channel=1
camera.capture_width=480
camera.capture_height=800
# On-demand VIPP4 capture from ISP0 for record/snapshot/RTSP.
# The running firmware must enable vinc@4; preview does not require this node.
camera.media_vipp_device=4
camera.media_capture_width=1280
camera.media_capture_height=720
camera.frame_rate=20
camera.vi_buffer_count=5
camera.pixel_format=nv21

# 1280x720 and the single-file H.264/MP4 behavior are frozen requirements.
# 20 fps/4 Mbit/s are selected product defaults but remain unverified on V851S;
# VBV sizes and channel IDs are bring-up candidates.
record.venc_channel=0
# Legacy field; current SDK has no MUX group and only accepts zero.
record.mux_group=0
record.mux_channel=0
record.width=1280
record.height=720
record.frame_rate=20
record.bit_rate=4000000
record.vbv_buffer_bytes=2097152
record.vbv_threshold_bytes=1048576
record.codec=h264
record.container=mp4
# One user-controlled file only: no time/size segmentation or circular overwrite.
# Repair tags are emitted by the vendor MP4 muxer. Automatic repair still needs
# the separate libfilerepair utility and is not claimed by this profile.
record.add_repair_info=1
record.repair_backup_interval_us=100000
# Polling only detects unavailable/full storage and asks the control thread to
# stop recording. It never mounts, force-unmounts or formats a card.
record.storage_poll_ms=1000
record.storage_reserve_bytes=67108864

snapshot.venc_channel=1
snapshot.width=1280
snapshot.height=720
snapshot.quality=90
snapshot.timeout_ms=2000

# Camera optional RTSP output, based on sample_smartIPC_demo's
# VI -> H.264 VENC -> GetStream -> TinyServer design. It has its own VI/VENC
# channels, one bounded frame-copy buffer, no audio data path, and does not
# auto-start. The legacy server may still advertise an empty AAC SDP track.
rtsp.enabled=1
rtsp.vi_channel=2
rtsp.venc_channel=2
rtsp.width=1280
rtsp.height=720
rtsp.frame_rate=15
rtsp.bit_rate=1500000
rtsp.vbv_buffer_bytes=1048576
rtsp.vbv_threshold_bytes=524288
rtsp.max_frame_bytes=2764800
rtsp.codec=h264
rtsp.network_interface=eth0
rtsp.port=8554
rtsp.stream_name=ch0

playback.demux_channel=0
playback.vdec_channel=0
playback.clock_channel=0
# Physical album window: Qt logical (144,40,644,388) rotated clockwise 90.
# Playback uses display.scale_mode inside it and reports the actual physical
# rectangle over IPC. Qt applies the inverse rotation before clearing alpha.
playback.display_x=52
playback.display_y=144
playback.display_width=388
playback.display_height=644
# Either 1280x720 landscape or the rotated 720x1280 form is accepted.
playback.max_source_width=1280
playback.max_source_height=720
# Candidate L4 matrix derived from sample_demux2vdec2vo and the selected
# standalone parser/decoder archives. Unknown (zero) source metadata is allowed;
# reported values above these limits are rejected before VDEC creation.
playback.max_frame_rate=30
playback.max_bit_rate=8000000
playback.allow_h264=1
# Current SDK CONFIG_mpp_vdec_h265 is disabled.
playback.allow_h265=0
playback.allow_mjpeg=1
playback.support_b_frames=0
playback.force_frame_package=0
# 0 keeps the MPP default (sample documents it as 300 MHz).
playback.ve_frequency_mhz=0

# UVC gadget output based on sun8iw21 sample_uvcout. The USB function,
# descriptors and UDC binding must already exist; this service deliberately
# does not mutate configfs or compose UVC with ADB. Descriptor format/frame
# indices must match the matrix documented in requirements.md.
uvc.enabled=1
uvc.video_device=/dev/video2
uvc.bulk_mode=0
uvc.isp_device=0
uvc.vipp_device=0
uvc.vi_channel=0
uvc.venc_channel=0
uvc.vi_buffer_count=5
uvc.gadget_buffer_count=5
# Bounded application copy queue. When the Host is slower, the oldest queued
# frame is dropped so VI/VENC resources are always returned promptly.
uvc.frame_queue_depth=3
uvc.frame_timeout_ms=200
uvc.mjpeg_bit_rate=4194304
uvc.h264_bit_rate=4194304
uvc.venc_vbv_buffer_bytes=4194304
uvc.venc_vbv_threshold_bytes=2097152
uvc.max_frame_bytes=4194304
