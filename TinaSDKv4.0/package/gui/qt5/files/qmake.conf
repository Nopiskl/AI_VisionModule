#
# qmake configuration for Tina/OpenWrt cross builds.
#

MAKEFILE_GENERATOR       = UNIX
CONFIG                  += incremental
QMAKE_INCREMENTAL_STYLE  = sublib

QT_QPA_DEFAULT_PLATFORM = linuxfb

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

TINA_INCDIRS = $$(TARGET_INCDIRS)
QMAKE_INCDIR = $$split(TINA_INCDIRS, " ")
TINA_LIBDIRS = $$(TARGET_LIBDIRS)
QMAKE_LIBDIR = $$split(TINA_LIBDIRS, " ")
QMAKE_CC           = $$(TARGET_CC)
QMAKE_CXX          = $$(TARGET_CXX)
QMAKE_AR           = $$(TARGET_AR)
QMAKE_OBJCOPY      = $$(TARGET_OBJCOPY)
QMAKE_RANLIB       = $$(TARGET_RANLIB)
QMAKE_CFLAGS       = $$(TARGET_CFLAGS)
QMAKE_CXXFLAGS     = $$(TARGET_CXXFLAGS)
QMAKE_NM           =
QMAKE_LINK         = $$(TARGET_CXX)
QMAKE_LINK_SHLIB   = $$(TARGET_CXX)
QMAKE_LINK_C       = $$(TARGET_CC)
QMAKE_LFLAGS       = $$(TARGET_LDFLAGS)

# OpenWrt supplies all warning/release/strip flags through the environment.
QMAKE_STRIP                      =
QMAKE_STRIPFLAGS_LIB             =
QMAKE_CFLAGS_WARN_ON             =
QMAKE_CFLAGS_WARN_OFF            =
QMAKE_CFLAGS_RELEASE             =
QMAKE_CFLAGS_DEBUG               =
QMAKE_CFLAGS_PRECOMPILE          =
QMAKE_CFLAGS_USE_PRECOMPILE      =
QMAKE_CXXFLAGS_WARN_ON           =
QMAKE_CXXFLAGS_WARN_OFF          =
QMAKE_CXXFLAGS_RELEASE           =
QMAKE_CXXFLAGS_DEBUG             =
QMAKE_CXXFLAGS_PRECOMPILE        =
QMAKE_CXXFLAGS_USE_PRECOMPILE    =
QMAKE_LFLAGS_RELEASE             =

load(qt_config)
